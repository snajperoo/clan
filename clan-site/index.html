<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- ... (Мета-теги и скрипты остаются без изменений) ... -->
    <script src="appv6.js"></script>
    <style>
       /* ... (CSS остается без изменений) ... */
    </style>
</head>
<body>
    <!-- ... (Шапка с селектором сезона остается без изменений) ... -->
    
    <div class="tabs">
        <!-- ... (Кнопки вкладок остаются без изменений, но добавлена кнопка "Сводка админу" в Историю) ... -->
    </div>

    <!-- ==================== ТОПЫ ==================== -->
    <!-- ... (Блок Топы остается без изменений) ... -->

    <!-- ==================== МОЙ ПРОФИЛЬ ==================== -->
    <!-- ... (Блок Мой профиль остается без изменений) ... -->

    <!-- ==================== БАЗА ИГРОКОВ ==================== -->
    <!-- ... (Блок База игроков остается без изменений) ... -->

    <!-- ==================== СОСТАВ ==================== -->
    <!-- ... (Блок Состав остается без изменений) ... -->

    <!-- ==================== СРАВНЕНИЕ ==================== -->
    <!-- ... (Блок Сравнение остается без изменений) ... -->

    <!-- ==================== ИСТОРИЯ ==================== -->
    <div id="tab-history" class="tab-content">
        <div class="stage-header">
            <h2 style="color:var(--accent-color); margin:0; text-transform: uppercase;">История матчей</h2>
            <div style="display:flex; gap:15px; align-items:center; flex-wrap:wrap;">
                <span style="color:var(--text-muted); font-size:0.85em; text-transform:uppercase;">
                    Турниров: <strong id="history-tournament-count" style="color:var(--accent-color);">0</strong>
                    · Этапов: <strong id="history-stage-count" style="color:var(--accent-color);">0</strong>
                </span>
                <!-- Кнопка вызова сводки для админа -->
                <button class="btn" onclick="sendAdminSummaryToDiscord()" style="background:#5865F2; color:white; font-size:0.8em; padding:8px 15px;" title="Отправить сводку в Discord">🤖 Сводка в ЛС</button>
            </div>
        </div>
        
        <div id="tournament-mvp-container"></div>

        <div class="analytics-card" style="display:flex; flex-direction:column; align-items:center; justify-content:center; margin-bottom: 30px;">
            <h3 style="color:var(--accent-color); margin-top:0; text-transform: uppercase;">Общая диагностика</h3>
            
            <!-- БЛОК С РЕЙТИНГОМ, ТИРОМ И ГИЛЬЗАМИ -->
            <div style="display:flex; justify-content:center; gap:20px; margin-bottom:20px; width:100%; flex-wrap:wrap;">
                <!-- Текущий рейтинг -->
                <div style="background:rgba(255,152,0,0.1); border:2px solid var(--accent-color); border-radius:var(--radius); padding:15px 30px; text-align:center; box-shadow:0 0 15px rgba(255,152,0,0.2); flex:1; min-width:200px;">
                    <div style="color:var(--accent-color); font-size:0.9em; text-transform:uppercase; letter-spacing:2px; font-weight:bold; margin-bottom:5px;">Рейтинг</div>
                    <div><strong id="hr-rating" style="color:var(--accent-color); font-size:2.5em; font-family:'Courier New', monospace; text-shadow:0 0 10px rgba(255,152,0,0.5);">1000</strong></div>
                </div>
                <!-- Текущий Тир -->
                <div style="background:rgba(255,255,255,0.05); border:2px solid #555; border-radius:var(--radius); padding:15px 30px; text-align:center; flex:1; min-width:200px;">
                    <div style="color:var(--text-muted); font-size:0.9em; text-transform:uppercase; letter-spacing:2px; font-weight:bold; margin-bottom:5px;">Текущий Тир</div>
                    <div><strong id="hr-tier" style="color:var(--accent-color); font-size:2.5em; font-family:'Courier New', monospace;">E Тир</strong></div>
                </div>
                <!-- Заработанные Гильзы -->
                <div style="background:rgba(156,220,254,0.05); border:2px solid #9cdcfe; border-radius:var(--radius); padding:15px 30px; text-align:center; flex:1; min-width:200px;">
                    <div style="color:#9cdcfe; font-size:0.9em; text-transform:uppercase; letter-spacing:2px; font-weight:bold; margin-bottom:5px;">Заработано гильз</div>
                    <div><strong id="hr-gears" style="color:#9cdcfe; font-size:2.5em; font-family:'Courier New', monospace;">0</strong></div>
                </div>
            </div>
            <!-- КОНЕЦ БЛОКА -->

            <div style="width: 250px; height: 250px;">
                <canvas id="matchHistoryChart"></canvas>
            </div>
            
            <!-- ... (Блок с процентами побед и т.д. остается без изменений) ... -->
            <div id="history-winrate" style="display:flex; gap:25px; flex-wrap:wrap; justify-content:center; margin-top:20px; font-size:1.1em; font-family:'Courier New', monospace;">
                <div>
                    <div style="color:var(--text-muted); font-size:0.75em; text-transform:uppercase; letter-spacing:1px;">Победы</div>
                    <div><strong id="hr-wins" style="color:var(--success-color); font-size:1.4em;">0</strong>
                        <span style="color:var(--text-muted);">(<span id="hr-wins-pct">0%</span>)</span></div>
                </div>
                <div>
                    <div style="color:var(--text-muted); font-size:0.75em; text-transform:uppercase; letter-spacing:1px;">Поражения</div>
                    <div><strong id="hr-losses" style="color:var(--danger-color); font-size:1.4em;">0</strong>
                        <span style="color:var(--text-muted);">(<span id="hr-losses-pct">0%</span>)</span></div>
                </div>
                <div>
                    <div style="color:var(--text-muted); font-size:0.75em; text-transform:uppercase; letter-spacing:1px;">Ничьи</div>
                    <div><strong id="hr-draws" style="color:var(--accent-color); font-size:1.4em;">0</strong>
                        <span style="color:var(--text-muted);">(<span id="hr-draws-pct">0%</span>)</span></div>
                </div>
                <div>
                    <div style="color:var(--text-muted); font-size:0.75em; text-transform:uppercase; letter-spacing:1px;">Всего</div>
                    <div><strong id="hr-total" style="color:var(--text-color); font-size:1.4em;">0</strong>
                        <span style="color:var(--text-muted);">игр</span></div>
                </div>
            </div>
        </div>

        <div style="display:flex; justify-content:center; margin-bottom: 20px; gap: 10px;" class="admin-only">
            <button class="btn" onclick="addMatchHistory()">Заполнить первый свободный этап</button>
        </div>

        <div class="timeline" id="history-timeline"></div>
    </div>

    <!-- ... (Остальные вкладки и модальные окна без изменений) ... -->
</body>
</html>
